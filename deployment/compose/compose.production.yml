name: nr-panel
services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nrpanel
      POSTGRES_USER: nrpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ${NR_PANEL_DATA_DIR:-/var/lib/nr-panel}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrpanel -d nrpanel"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}"]
    volumes:
      - ${NR_PANEL_DATA_DIR:-/var/lib/nr-panel}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?required}" }
    networks: [backend]
  api:
    image: ${NR_PANEL_IMAGE_PREFIX:?required}-api:${NR_PANEL_VERSION:?required}
    restart: unless-stopped
    env_file: ["${NR_PANEL_CONFIG_FILE:-/etc/nr-panel/production.env}"]
    environment:
      DATABASE_URL: postgresql://nrpanel:${POSTGRES_PASSWORD}@postgres:5432/nrpanel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
  web:
    image: ${NR_PANEL_IMAGE_PREFIX:?required}-web:${NR_PANEL_VERSION:?required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:4000/api/v1
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
  proxy:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ["${PANEL_PORT:?required}:8080"]
    environment:
      PANEL_PATH: ${PANEL_PATH:?required}
      NGINX_ENVSUBST_FILTER: ^PANEL_PATH$
    volumes:
      - ${NR_PANEL_CURRENT_DIR:?required}/deployment/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
networks:
  backend: { driver: bridge }
